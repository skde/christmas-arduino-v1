<text class="nt" x="13" y="266.9">Long edge runs along the ridge. Pitch 50°.</text>
<text class="nt" x="13" y="270.5">Flutes run down the slope. The wider panel overlaps the other at the ridge.</text>
<text class="nt" x="13" y="274.1">No overhang at the front: ends flush with the front gable, where the tower stands.</text>
