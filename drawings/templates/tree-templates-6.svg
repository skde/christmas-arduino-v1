<text class="nt" x="13.0" y="223.66">Cone 8.6 across, 7.2 tall. Arc radius 8.39, sector 185° in total.</text>
<text class="nt" x="13.0" y="227.26">Roll into a cone and glue the tab under the other straight edge.</text>
<text class="nt" x="13.0" y="230.85999999999999">Top hole fits the core tube (1.9 across). Notch lets the pixel wires up to the</text>
<text class="nt" x="13.0" y="234.45999999999998">next tier.</text>
<text class="nt" x="13.0" y="238.05999999999997">Pixel windows Ø6 mm at 1.5 cm above the rim. Numbers give the chain order.</text>
