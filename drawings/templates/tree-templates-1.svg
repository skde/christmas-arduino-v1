<text class="nt" x="13" y="276.0">Roll two turns around a 1.8 cm former (a thick marker), starting from the left edge,</text>
<text class="nt" x="13" y="279.6">so the marked strip ends up outside. Glue all over. The two slots line up.</text>
<text class="nt" x="13" y="283.20000000000005">Pixel wires come up inside the tube from the disc and leave through the slot.</text>
