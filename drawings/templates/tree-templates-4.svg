<text class="nt" x="135.92" y="89.44999999999999">back to back on a toothpick (the mark).</text>
<text class="nt" x="135.92" y="93.04999999999998">Push the toothpick 1.5 cm into the tip of</text>
<text class="nt" x="135.92" y="96.64999999999998">tier 5.</text>
