<text class="nt" x="13.0" y="236.89">Cone 14 across, 7.2 tall. Arc radius 10.04, sector 251° in total.</text>
<text class="nt" x="13.0" y="240.48999999999998">Two halves: glue each tab under the other half's straight edge.</text>
<text class="nt" x="13.0" y="244.08999999999997">Top hole fits the core tube (1.9 across). Notch lets the pixel wires up to the next</text>
<text class="nt" x="13.0" y="247.68999999999997">tier.</text>
<text class="nt" x="13.0" y="251.28999999999996">Pixel windows Ø6 mm at 1.5 cm above the rim. Numbers give the chain order.</text>
