<text class="nt" x="13.0" y="200.73">Cone 5.8 across, 7.2 tall. Arc radius 7.76, sector 134° in total.</text>
<text class="nt" x="13.0" y="204.32999999999998">Roll into a cone and glue the tab under the other straight edge.</text>
<text class="nt" x="13.0" y="207.92999999999998">Pointed: it slides over the top of the core tube. Star on a toothpick in</text>
