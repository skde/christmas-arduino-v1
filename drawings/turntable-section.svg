<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1110 650" width="1110" height="650" role="img" aria-label="Cross-section of the turntable. A paper tree stands on a 22 cm rink disc that sits flush in a hole in the deck. A flange coupling joins the disc to an 8 mm brass tube carrying the tree wires. The tube runs through two KFL08 flange bearings on a plywood drive plate. A 60-tooth pulley on the tube is driven by a GT2 belt from a 20-tooth pulley on the 28BYJ-48 stepper beside it, a 3 to 1 reduction. Below the plate, a silicone hose joins the tube to the slip ring rotor. The slip ring body is screwed to the base floor and its six wires run to the Nano and power rail.">
